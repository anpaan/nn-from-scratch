<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NN Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Neural Network Playground</h1>
      <p>A network written from scratch, training live in your browser.</p>
    </header>
    <main>
      <section id="controls">
        <label>Dataset
          <select id="dataset">
            <option value="spiral" selected>Spiral (3 classes)</option>
            <option value="circles">Circles</option>
            <option value="xor">XOR</option>
          </select>
        </label>
        <label>Learning rate
          <select id="lr">
            <option>0.001</option>
            <option>0.01</option>
            <option>0.03</option>
            <option>0.1</option>
            <option selected>0.3</option>
            <option>1</option>
            <option>3</option>
          </select>
        </label>
        <label>Hidden layers
          <select id="layers">
            <option>0</option>
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
            <option>4</option>
          </select>
        </label>
        <label>Neurons per layer
          <select id="neurons">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>6</option>
            <option selected>8</option>
          </select>
        </label>
        <label>Activation
          <select id="activation">
            <option value="tanh" selected>Tanh</option>
            <option value="relu">ReLU</option>
            <option value="sigmoid">Sigmoid</option>
          </select>
        </label>
        <div class="buttons">
          <button id="play">⏸ Pause</button>
          <button id="reset">↺ Reset</button>
        </div>
        <p class="hint">Changing any setting resets the network and starts training again.</p>
      </section>
      <section id="network">
        <!-- M8: neurons + connections; thickness = |weight|, blue = positive, orange = negative -->
        <svg id="net-svg" width="480" height="360"></svg>
      </section>
      <section id="output">
        <!-- M7: decision-boundary heatmap + data points -->
        <canvas id="boundary" width="360" height="360"></canvas>
        <p id="status"></p>
        <!-- M8: loss chart -->
        <canvas id="loss-chart" width="360" height="120"></canvas>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
